function applyBrandFont(){document.querySelectorAll('.brand,.signature-name').forEach(el=>{el.classList.toggle('arabic-brand',lang==='ar');el.classList.toggle('english-brand',lang==='en')})}
applyBrandFont();
const names={ar:{cold:'المشروبات الباردة',juice:'العصائر الفريش',coffee:'القهوة',hot:'المشروبات الساخنة',mix:'الكوكتيلات والميلك شيك',shisha:'ركن الشيشة',dessert:'الحلويات'},en:{cold:'Cold Drinks',juice:'Fresh Juices',coffee:'Coffee',hot:'Hot Drinks',mix:'Cocktails & Milkshakes',shisha:'Shisha Corner',dessert:'Desserts'}};
const icons={cold:'🧊',juice:'🍹',coffee:'☕',hot:'🍵',mix:'🥤',shisha:'♨️',dessert:'🍰'};
const descriptions={cold:'COLD & REFRESHING',juice:'FRESH JUICES',coffee:'COFFEE',hot:'HOT DRINKS',mix:'MIXED FAVORITES',shisha:'SHISHA FLAVORS',dessert:'DESSERTS'};
function nm(c){return lang==='en'?(c.en||names.en[c.id]||''):(c.ar||names.ar[c.id]||'')}
function menuItems(c){return lang==='en'?c.items.filter(it=>!['Qass & Salloum Shisha','Fenugreek','Fenugreek with Milk'].includes(it[1])):c.items}
const categoryPhotos={
cold:'./assets/menu/category-cold.jpg',
juice:'https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=1000&q=90',
coffee:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1000&q=90',
hot:'./assets/menu/category-hot.png',
mix:pics.mangoKiwiBanana,
shisha:'./assets/menu/category-shisha.jpg',
dessert:'https://canelitacheesecake.com/cdn/shop/files/Trozodepasteldeterciopelorojo.png?v=1776101792'
};
function card(c){let img=categoryPhotos[c.id]||'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1000&q=90';let title=lang==='en'?(c.en||names.en[c.id]||''):(c.ar||names.ar[c.id]||'');let subtitle=lang==='en'?(descriptions[c.id]||''):'';return `<button class="cat" data-bg="${img}" onclick="openCat('${c.id}')" style="background-image:linear-gradient(0deg,#160802e8 0%,#16080220 78%);background-size:cover;background-position:center;background-repeat:no-repeat"><div class="photo"><div><b>${title}</b>${subtitle?`<small>${subtitle}</small>`:''}</div></div></button>`}
function loadCategoryImages(){const cards=document.querySelectorAll('.cat[data-bg]');if(!('IntersectionObserver' in window)){cards.forEach(el=>{el.style.backgroundImage="linear-gradient(0deg,#160802e8 0%,#16080220 78%),url('"+el.dataset.bg+"')";el.removeAttribute('data-bg')});return}const observer=new IntersectionObserver((entries,obs)=>{entries.forEach(entry=>{if(entry.isIntersecting){const el=entry.target;el.style.backgroundImage="linear-gradient(0deg,#160802e8 0%,#16080220 78%),url('"+el.dataset.bg+"')";el.removeAttribute('data-bg');obs.unobserve(el)}})},{rootMargin:'50px'});cards.forEach(el=>observer.observe(el))}
function draw(){homeCats.innerHTML=data.map(card).join('');allCats.innerHTML=data.map(card).join('');loadCategoryImages()}
function go(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.go===id));window.scrollTo({top:0,behavior:'smooth'})}
function nav(id){go(id)}
function toggleLang(){
lang=lang==='ar'?'en':'ar';
document.documentElement.lang=lang;
document.documentElement.dir=lang==='ar'?'rtl':'ltr';
langBtn.textContent=lang==='ar'?'English':'العربية';
brandName.textContent=lang==='ar'?'حدوته':'Hadota Cafe';
document.querySelectorAll('.signature-name').forEach(el=>el.textContent=lang==='ar'?'حدوته':'Hadota Cafe');
applyBrandFont();
heroTitle.textContent=lang==='ar'?'حكايتك الحلوة تبدأ هنا':'Your lovely moment starts here';
const heroTextEl=document.getElementById('heroText'); if(heroTextEl) heroTextEl.textContent='';
categoriesHeading.textContent=lang==='ar'?'اكتشف الأقسام':'Explore Categories';
allLabel.textContent=lang==='ar'?'عرض الكل ←':'View all →';
allCatsTitle.textContent=lang==='ar'?'كل الأقسام':'All Categories';
backCats.textContent=lang==='ar'?'← الرئيسية':'← Home';
backDetail.textContent=lang==='ar'?'← رجوع':'← Back';
searchTitle.textContent=lang==='ar'?'ابحث في المنيو':'Search the menu';
searchInput.placeholder=lang==='ar'?'اكتب اسم الصنف...':'Type an item name...';
document.querySelectorAll('.bottom span').forEach(s=>s.textContent=s.dataset[lang]);
draw();
if(window.currentCat){
  const c=data.find(x=>x.id===window.currentCat);
  if(c){
    detailTitle.textContent=nm(c);
    if(c.id==='dessert'){
      items.innerHTML='<div class="desserts">'+menuItems(c).map(([ar,en,p,img])=>`<article class="dessert"><img src="${pics[img]}" loading="lazy" decoding="async" alt="${lang==='ar'?ar:(en||'')}"><div>${lang==='ar'?ar:(en||'')}</div></article>`).join('')+'</div>';
    }else{
      items.innerHTML='<div class="list">'+menuItems(c).map(([ar,en,p])=>`<div class="item"><span>${lang==='ar'?ar:(en||'')}</span><b class="price">${p==null?'':p+' '+(lang==='ar'?'ج.م':'EGP')}</b></div>`).join('')+'</div>';
    }
  }
}
if(searchInput.value.trim()) searchItems();
}

function openCat(id){window.currentCat=id;let c=data.find(x=>x.id===id);detailTitle.textContent=nm(c);if(id==='dessert'){items.innerHTML='<div class="desserts">'+menuItems(c).map(([ar,en,p,img])=>`<article class="dessert"><img src="${pics[img]}" loading="lazy" decoding="async" alt="${lang==='ar'?ar:(en||'')}"><div>${lang==='ar'?ar:(en||'')}</div></article>`).join('')+'</div>'}else{items.innerHTML='<div class="list">'+menuItems(c).map(([ar,en,p])=>`<div class="item"><span>${lang==='ar'?ar:(en||'')}</span><b class="price">${p==null?'':p+' '+(lang==='ar'?'ج.م':'EGP')}</b></div>`).join('')+'</div>'}go('detail')}
function searchItems(){let q=searchInput.value.trim().toLowerCase(),out=[];data.forEach(c=>menuItems(c).forEach(it=>{if(q&&(it[0].toLowerCase().includes(q)||it[1].toLowerCase().includes(q)))out.push([it,c])}));searchResults.innerHTML=out.map(([it,c])=>`<div class="item"><span>${lang==='ar'?it[0]:(it[1]||'')}<small style="display:block;color:#9a8876;margin-top:4px">${nm(c)}</small></span><b class="price">${it[2]==null?'':it[2]+' '+(lang==='ar'?'ج.م':'EGP')}</b></div>`).join('')||(lang==='en'?'<div class="item">No results found</div>':'<div class="item">لا توجد نتائج</div>')}
draw();
</script><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }, { once: true });
}
</script></body></html>
